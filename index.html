function eatX(a){if(a=='eatc'){if(P.c>0&&P.hun<100){P.c--;P.hun=Math.min(100,P.hun+30);P.hp=Math.min(100,P.hp+8);snd(520,.12,'sine',.08)}else toast(P.c?'أنت شبعان':'ما عندك لحم مطبوخ')}else{if(P.r>0&&P.hun<100){P.r--;P.hun=Math.min(100,P.hun+10);P.hp-=3;snd(300,.12,'sine',.06);toast('اللحم النيء مو زين، اطبخه!')}else toast('ما عندك لحم نيء')}}
function icon(rows,fn){const h=rows.length,w=rows[0].length,c=document.createElement('canvas');c.width=w+2;c.height=h+2;const x=c.getContext('2d');x.fillStyle='#1a0d0d';rows.forEach((r,j)=>[...r].forEach((ch,i)=>{if(ch!='.')for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++)x.fillRect(i+1+a,j+1+b,1,1)}));rows.forEach((r,j)=>[...r].forEach((ch,i)=>{if(ch!='.'){x.fillStyle=fn(ch,i,j);x.fillRect(i+1,j+1,1,1)}}));return c.toDataURL()}
const HM=['.XX...XX.','XXXX.XXXX','XXXXXXXXX','XXXXXXXXX','.XXXXXXX.','..XXXXX..','...XXX...','....X....'],FM=['.....MMM.','....MMMMM','...MMMMMM','...MMMMMM','..MMMMMM.','.BBMMMM..','BBB......','.B.......'];
const HI=[0,1,2].map(s=>icon(HM,(ch,i,j)=>s==2||(s==1&&i>4)?'#4a2222':(i<3&&j<3?'#ff9a9a':'#e02424'))),FI=[0,1,2].map(s=>icon(FM,(ch,i,j)=>ch=='B'?(s==2?'#4a4a4a':'#f4ecd6'):(s==2||(s==1&&i<4)?'#4a3220':(j<2?'#e8a05a':'#c7762f'))));
const IT=[['🪵','w'],['🪨','s'],['🫐','f','eat'],['🥩','r','eatr'],['🍖','c','eatc']],mc=document.createElement('div');mc.id='mc';mc.innerHTML='<div class=st><span id=mh></span><span id=mg></span></div><div id=hbar></div>';document.body.appendChild(mc);
const slots=IT.map(it=>{const d=document.createElement('div');d.className='slot';d.innerHTML=it[0]+'<b>0</b>';if(it[2])d.addEventListener('pointerdown',e=>{e.preventDefault();act(it[2])});$('hbar').appendChild(d);return d});
const invEl=document.createElement('div');invEl.id='inv';invEl.innerHTML='<h3>الحقيبة</h3><div class=ig id=ig></div><button data-a=wall>🧱 جدار — 2🪵</button><button data-a=fire>🔥 نار — 4🪵 2🪨</button><button data-a=sword>🪓 فأس حجري (تكسير أسرع) — 8🪵 5🪨</button><button data-a=cook>🍖 اطبخ اللحم (قرب النار)</button><button data-a=inv>إغلاق</button>';document.body.appendChild(invEl);
invEl.querySelectorAll('button').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();act(b.dataset.a)}));
const ib=document.createElement('button');ib.dataset.a='inv';ib.textContent='🎒';$('sm').appendChild(ib);ib.addEventListener('pointerdown',e=>{e.preventDefault();act('inv')});
let uk='';function toggleInv(){invEl.style.display=invEl.style.display=='block'?'none':'block';uk='';updUI()}
function updUI(){if(!P)return;const h=P.hp/10,u=P.hun/10,k=[Math.round(h*2),Math.round(u*2),P.w,P.s,P.f,P.r,P.c].join();if(k==uk)return;uk=k;
const row=(v,I)=>[...Array(10)].map((_,i)=>'<img src='+I[v>=i+1?0:v>=i+.5?1:2]+'>').join('');$('mh').innerHTML=row(h,HI);$('mg').innerHTML=row(u,FI);
IT.forEach((it,i)=>{slots[i].lastChild.textContent=P[it[1]]});if(invEl.style.display=='block')$('ig').innerHTML=IT.map(it=>'<div>'+it[0]+'<small>'+P[it[1]]+'</small></div>').join('')}
</script>
<script>
/* Extra villagers: varied blocky female characters + friendly social events */
(()=>{
  const girls=[], outfits=[0x563b78,0x2c6680,0x9b4965,0x56764a,0x9a6a35,0x40517d];
  const hairColors=[0x4b2c20,0x211a18,0x8a552d,0x5b3029,0xb08a52];
  const skinColors=[0xe8b99a,0xc98f70,0xf0c9a8,0xa96f52];
  const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.9});
  const cube=(g,w,h,d,x,y,z,c)=>{
    const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));
    m.position.set(x,y,z);m.castShadow=true;g.add(m);return m;
  };
  function makeGirl(i){
    const g=new THREE.Group(), outfit=outfits[i%outfits.length], hair=hairColors[i%hairColors.length],
      skin=skinColors[i%skinColors.length], type=i%3;
    // Three neutral body builds: slim, medium and fuller, without changing the block style.
    const width=[.55,.72,.92][type], hip=[.58,.76,.98][type];
    cube(g,width,.72,.38,0,1.28,0,skin);                 // head
    cube(g,width+.08,.22,.42,0,1.74,-.015,hair);         // hair cap
    cube(g,.13,.62,.42,-width*.43,1.38,-.01,hair);      // left hair
    cube(g,.13,.62,.42,width*.43,1.38,-.01,hair);       // right hair
    cube(g,.10,.07,.035,-.15,1.31,.205,0x283b64);       // eyes
    cube(g,.10,.07,.035,.15,1.31,.205,0x283b64);
    cube(g,.10,.035,.035,0,1.18,.215,0x9a5d50);
    cube(g,hip,.62,.42,0,.78,0,outfit);                 // torso / outfit
    cube(g,.16,.55,.18,-width*.62,.84,0,skin);          // arms
    cube(g,.16,.55,.18,width*.62,.84,0,skin);
    cube(g,.25,.65,.25,-.17,.32,0,0x29232b);            // legs
    cube(g,.25,.65,.25,.17,.32,0,0x29232b);
    // Small accessory varies per villager.
    if(i%3===0) cube(g,.22,.12,.22,width*.34,1.78,0,0xd84d87); // hair bow
    if(i%3===1) cube(g,.62,.08,.16,0,1.82,0,0xd7b45c);          // hair band
    return g;
  }
  function addGirls(){
    for(let i=0;i<6;i++){
      const a=i*Math.PI/3+.35, r=13+(i%2)*5, x=Math.cos(a)*r, z=Math.sin(a)*r;
      const model=makeGirl(i);model.position.set(x,0,z);S.add(model);
      girls.push({model,x,z,homeX:x,homeZ:z,phase:i*.9,wait:2+i*.4,step:0,kind:i%3});
    }
  }
  const oldReset=resetWorld;
  resetWorld=function(){oldReset();girls.forEach(n=>S.remove(n.model));girls.length=0;addGirls();};
  const oldAnim=anim;
  anim=function(dt){
    oldAnim(dt);
    for(const n of girls){
      n.wait-=dt;
      if(n.wait<=0){n.wait=2+Math.random()*3;n.phase+=(Math.random()-.5)*1.8;}
      const tx=n.homeX+Math.sin(n.phase)*2.2, tz=n.homeZ+Math.cos(n.phase*.8)*2.2;
      const dx=tx-n.x,dz=tz-n.z,d=Math.hypot(dx,dz);
      if(d>.15){n.x+=dx/d*.65*dt;n.z+=dz/d*.65*dt;n.model.rotation.y=Math.atan2(dx,dz);n.step+=dt*7;}
      n.model.position.set(n.x,Math.abs(Math.sin(n.step))*.035,n.z);
    }
    if(typeof P!=="undefined" && P){
      const near=nearestGirl();
      socialBtn.style.display=near?"block":"none";
      socialBtn.textContent=near?"💬 تفاعل مع "+near.label:"";
    }
  };
  function nearestGirl(){
    if(typeof P==="undefined"||!P)return null;
    let best=null,dist=4.5;
    girls.forEach((n,i)=>{const d=Math.hypot(n.x-P.x,n.z-P.z);if(d<dist){dist=d;best={...n,label:"القروية "+(i+1)}}});
    return best;
  }
  const panel=document.createElement("div");
  panel.style.cssText="position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);z-index:8;display:none;background:#17251fee;border:2px solid #d8c18b;border-radius:14px;padding:18px;color:white;text-align:center;width:min(290px,85vw);font: bold 16px system-ui;line-height:1.8";
  panel.innerHTML='<div id="socialText">أهلًا!</div><button id="friendBtn" style="margin:6px;padding:10px 16px;border:0;border-radius:9px;background:#e7b65d;color:#24180b;font-weight:bold">تعارف وصداقة</button><button id="wedBtn" style="margin:6px;padding:10px 16px;border:0;border-radius:9px;background:#d77c9d;color:white;font-weight:bold">حفل زواج</button><button id="restBtn" style="margin:6px;padding:10px 16px;border:0;border-radius:9px;background:#6b9b9a;color:white;font-weight:bold">استراحة واهتمام بالنظافة</button><button id="closeSocial" style="margin:6px;padding:8px 14px;border:1px solid #aaa;border-radius:9px;background:#333;color:white">إغلاق</button>';
  document.body.appendChild(panel);
  const socialBtn=document.createElement("button");
  socialBtn.style.cssText="display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 112px);z-index:7;border:2px solid #fff;background:#533d78;color:white;border-radius:14px;padding:12px 18px;font:bold 15px system-ui";
  document.body.appendChild(socialBtn);
  let friend=false;
  socialBtn.addEventListener("pointerdown",e=>{e.preventDefault();if(nearestGirl()){panel.style.display="block";document.getElementById("socialText").textContent="تقدر تتعرف على القروية وتبني صداقة معها."; }});
  document.getElementById("friendBtn").onclick=()=>{friend=true;document.getElementById("socialText").textContent="صرتوا أصدقاء! تقدرون تتمشون في القرية.";toast("🤝 بدأت صداقة جديدة");};
  document.getElementById("wedBtn").onclick=()=>{if(!friend){document.getElementById("socialText").textContent="ابدأ بالتعارف والصداقة أولًا.";return;}document.getElementById("socialText").textContent="💐 مبروك! أقيم حفل زواج بسيط مع زينة واحتفال.";toast("💐 حفل زواج سعيد!");for(let i=0;i<18;i++){const m=new THREE.Mesh(new THREE.BoxGeometry(.12,.12,.12),mat([0xffd36b,0xf28ab2,0xffffff][i%3]));m.position.set(P.x+(Math.random()-.5)*3,2+Math.random()*2,P.z+(Math.random()-.5)*3);S.add(m);setTimeout(()=>S.remove(m),1800);}};
  document.getElementById("restBtn").onclick=()=>{document.getElementById("socialText").textContent="أخذت استراحة واهتممت بالنظافة. تم تجديد طاقتك.";if(P){P.hp=Math.min(100,P.hp+12);P.hun=Math.min(100,P.hun+8);}toast("🧼 استراحة منعشة");};
  document.getElementById("closeSocial").onclick=()=>panel.style.display="none";
})();
</script>
