addEventListener('keyup',e=>{if(e.key==='Shift'){sprinting=false;$('runbtn').classList.remove('on')}if(key[e.key])K[key[e.key]]=0;if(e.key==' ')jh=0;if(e.key=='f')ah=0});
let jid=null,jo,lid=null,lx,ly;const J=$('jb'),JK=$('jk'),cv=R.domElement;
cv.addEventListener('pointerdown',e=>{if(e.clientX<innerWidth*.5&&jid===null){jid=e.pointerId;jo=[e.clientX,e.clientY];J.style.display='block';J.style.left=jo[0]+'px';J.style.top=jo[1]+'px'}else if(lid===null){lid=e.pointerId;lx=e.clientX;ly=e.clientY}});
cv.addEventListener('pointermove',e=>{if(e.pointerId===jid){let dx=e.clientX-jo[0],dy=e.clientY-jo[1];const d=Math.hypot(dx,dy),mx=45;if(d>mx){dx*=mx/d;dy*=mx/d}jx=dx/mx;jy=dy/mx;JK.style.transform='translate('+dx+'px,'+dy+'px)'}
else if(e.pointerId===lid){yaw-=(e.clientX-lx)*.0055;pitch=Math.max(-1.5,Math.min(1.5,pitch-(e.clientY-ly)*.0045));lx=e.clientX;ly=e.clientY}});
['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,e=>{if(e.pointerId===jid){jid=null;jx=jy=0;J.style.display='none';JK.style.transform=''}if(e.pointerId===lid)lid=null}));
function hold(id,dn,up){const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();b.classList.add('on');dn()});['pointerup','pointercancel','pointerleave'].forEach(n=>b.addEventListener(n,()=>{b.classList.remove('on');up()}))}
hold('at',()=>ah=1,()=>ah=0);hold('jp',()=>{jh=1;jmp=.15},()=>jh=0);hold('us',()=>{uh=1;ut=.4;useA()},()=>uh=0);hold('ib',()=>toggleInv(),()=>{});
document.addEventListener('touchmove',e=>{if(!e.target.closest('#inv'))e.preventDefault()},{passive:false});
