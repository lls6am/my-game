<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ظلال الأعماق</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d19;color:#e9f0ff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}
canvas{display:block;width:100vw;height:100vh;background:#0b1222}
#top{position:fixed;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;text-shadow:0 2px 4px #000;font-weight:800}
.panel{background:#101a2bcc;border:1px solid #a8c4e755;border-radius:12px;padding:8px 12px;backdrop-filter:blur(5px)}
#hearts{font-size:20px;letter-spacing:3px;color:#ff758d}#info{font-size:12px;color:#c4d4ee;text-align:left;direction:ltr}
#toast{position:fixed;top:20%;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:12px;background:#101a2be8;border:1px solid #a8c4e7;color:white;opacity:0;transition:opacity .25s;pointer-events:none;text-align:center;max-width:90vw}
#start{position:fixed;inset:0;background:linear-gradient(#08101be8,#08101bf2);display:flex;align-items:center;justify-content:center;text-align:center;padding:22px}
#card{max-width:520px;background:#101a2b;border:1px solid #7895ba66;border-radius:22px;padding:24px;box-shadow:0 20px 80px #0009}
h1{margin:0 0 8px;font-size:clamp(30px,8vw,52px);letter-spacing:1px;color:#e9f2ff}
p{line-height:1.8;color:#bdcce2}
button{font:700 15px system-ui;border:1px solid #b5d5ff66;color:#f5f8ff;background:#253b59;border-radius:12px;padding:12px 18px}
#play{background:#8bb9e9;color:#08101b;border:0;font-size:18px;padding:13px 30px}
#touch{position:fixed;bottom:18px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}
.pad,.acts{display:flex;gap:9px;pointer-events:auto}
.ctrl{width:58px;height:58px;border-radius:50%;background:#17243bcc;border:1px solid #d6e7ff88;color:#fff;font-size:22px;display:grid;place-items:center;user-select:none}
.ctrl:active,.ctrl.on{background:#648bb8}
.acts{flex-wrap:wrap;justify-content:flex-end;max-width:210px}
.acts .ctrl{width:62px;height:62px;font-size:17px;border-radius:18px}
#hint{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);font-size:11px;color:#dce8f8aa;white-space:nowrap;pointer-events:none}
@media(min-width:800px){#touch{opacity:.75}.ctrl{width:52px;height:52px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="top">
 <div class="panel"><div id="hearts">♥ ♥ ♥ ♥ ♥</div><div id="soul" style="font-size:12px;color:#a9d9ff">طاقة: ◉ ◉ ◉</div></div>
 <div class="panel" id="info">DEPTHS / 01<br>شظايا: 0</div>
</div>
<div id="toast"></div>
<div id="hint">تحرك ◀ ▶ · اقفز ▲ · هجوم ⚔ · اندفاع ✦</div>
<div id="touch">
 <div class="pad"><button class="ctrl" data-key="left">◀</button><button class="ctrl" data-key="right">▶</button></div>
 <div class="acts"><button class="ctrl" data-key="jump">قفز</button><button class="ctrl" data-key="attack">⚔</button><button class="ctrl" data-key="dash">✦</button></div>
</div>
<div id="start"><div id="card">
<h1>ظلال الأعماق</h1>
<p>مغامرة منصات وقتال واستكشاف في مملكة منسية. اقفز بين الجزر، واجه الحراس، واجمع الشظايا، وافتح البوابة القديمة.</p>
<p><b>التحكم:</b> الأسهم أو A/D للحركة، Space للقفز، J للهجوم، K للاندفاع.</p>
<button id="play">ابدأ الرحلة</button>
</div></div>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let W=innerWidth,H=innerHeight,dpr=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
const keys={left:false,right:false,jump:false,attack:false,dash:false};
addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['arrowleft','a'].includes(k))keys.left=true;if(['arrowright','d'].includes(k))keys.right=true;if([' ','arrowup','w'].includes(k))keys.jump=true;if(k==='j')keys.attack=true;if(k==='k'||k==='shift')keys.dash=true});
addEventListener('keyup',e=>{let k=e.key.toLowerCase();if(['arrowleft','a'].includes(k))keys.left=false;if(['arrowright','d'].includes(k))keys.right=false;if([' ','arrowup','w'].includes(k))keys.jump=false;if(k==='j')keys.attack=false;if(k==='k'||k==='shift')keys.dash=false});
document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;const on=e=>{e.preventDefault();keys[k]=true;b.classList.add('on')},off=e=>{e.preventDefault();keys[k]=false;b.classList.remove('on')};b.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(n=>b.addEventListener(n,off))});
let running=false,frame=0,camera=0,shake=0,toastTimer=0;
const worldW=3600,gravity=.62;
const player={x:90,y:200,w:28,h:42,vx:0,vy:0,face:1,ground:false,hp:5,maxHp:5,soul:3,shards:0,attack:0,dash:0,dashCd:0,inv:0,checkpoint:90};
const platforms=[
{x:0,y:430,w:520,h:90},{x:590,y:390,w:180,h:28},{x:830,y:345,w:170,h:28},{x:1080,y:410,w:250,h:35},
{x:1410,y:360,w:170,h:28},{x:1640,y:310,w:200,h:28},{x:1910,y:400,w:280,h:35},{x:2250,y:350,w:180,h:28},
{x:2500,y:300,w:190,h:28},{x:2760,y:405,w:300,h:45},{x:3140,y:350,w:170,h:28},{x:3380,y:430,w:300,h:90},
{x:400,y:300,w:100,h:18},{x:960,y:250,w:100,h:18},{x:1770,y:210,w:100,h:18},{x:2380,y:245,w:100,h:18},{x:3000,y:285,w:100,h:18}
];
const enemies=[
{x:390,y:390,w:34,h:36,min:330,max:490,v:1.1,hp:2,alive:true,kind:0},
{x:900,y:305,w:34,h:36,min:845,max:965,v:1.3,hp:2,alive:true,kind:0},
{x:1190,y:370,w:42,h:40,min:1100,max:1280,v:1.0,hp:3,alive:true,kind:1},
{x:1710,y:270,w:34,h:36,min:1660,max:1800,v:1.4,hp:2,alive:true,kind:0},
{x:2020,y:360,w:44,h:40,min:1930,max:2140,v:1.15,hp:3,alive:true,kind:1},
{x:2840,y:365,w:44,h:40,min:2780,max:3000,v:1.1,hp:3,alive:true,kind:1},
{x:3260,y:310,w:36,h:38,min:3150,max:3310,v:1.5,hp:2,alive:true,kind:0}
];
const shards=[{x:460,y:260,taken:false},{x:730,y:320,taken:false},{x:1010,y:210,taken:false},{x:1510,y:320,taken:false},{x:1810,y:170,taken:false},{x:2350,y:310,taken:false},{x:2600,y:260,taken:false},{x:3200,y:310,taken:false}];
const particles=[];
function say(t){const el=document.getElementById('toast');el.textContent=t;el.style.opacity=1;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.style.opacity=0,1800)}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x-camera,y,w,h)}
function hit(a,b){return a.x+a.w>b.x&&a.x<b.x+b.w&&a.y+a.h>b.y&&a.y<b.y+b.h}
function burst(x,y,color,n=10){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*5,vy:(Math.random()-.8)*5,life:25+Math.random()*15,color})}
function hurt(){if(player.inv>0)return;player.hp--;player.inv=80;player.vy=-6;player.vx=-player.face*4;shake=9;burst(player.x+14,player.y+20,'#ff8295',15);if(player.hp<=0){player.hp=player.maxHp;player.x=player.checkpoint;player.y=260;player.vx=player.vy=0;player.shards=Math.max(0,player.shards-2);say('عدت إلى نقطة الحفظ');}}
function attack(){if(player.attack>0)return;player.attack=18;const area={x:player.face>0?player.x+player.w:player.x-42,y:player.y+7,w:42,h:28};let hitAny=false;for(const e of enemies){if(!e.alive)continue;const box={x:e.x,y:e.y,w:e.w,h:e.h};if(hit(area,box)){e.hp--;hitAny=true;burst(e.x+e.w/2,e.y+15,'#b8eaff',8);if(e.hp<=0){e.alive=false;player.shards++;burst(e.x+e.w/2,e.y,'#7de4ff',18)}}}if(hitAny){player.soul=Math.min(3,player.soul+1)}}
function drawBg(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0a1224');g.addColorStop(.6,'#17243b');g.addColorStop(1,'#101827');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 for(let layer=0;layer<3;layer++){ctx.fillStyle=['#101c31','#14243a','#1a2c43'][layer];let base=H*.55+layer*65;ctx.beginPath();ctx.moveTo(0,H);for(let x=-100;x<W+150;x+=100){let xx=x-(camera*(.12+layer*.1)%300);ctx.lineTo(xx,base+Math.sin((x+layer*90)*.012)*35)}ctx.lineTo(W,H);ctx.fill()}
 for(let i=0;i<75;i++){let x=(i*173-camera*.18)%(W+40);if(x<0)x+=W+40;let y=(i*71)%Math.max(1,H*.62);ctx.fillStyle=`rgba(180,215,255,${.2+(i%4)*.12})`;ctx.fillRect(x,y,2,2)}
}
function drawPlatform(p){let x=p.x-camera;ctx.fillStyle='#243951';ctx.fillRect(x,p.y,p.w,p.h);ctx.fillStyle='#7192ad';ctx.fillRect(x,p.y,p.w,5);ctx.fillStyle='#17283d';for(let i=10;i<p.w;i+=35){ctx.fillRect(x+i,p.y+12,4,5);ctx.fillRect(x+i+12,p.y+24,3,4)}}
function drawPlayer(){let x=player.x-camera,y=player.y;ctx.save();if(player.inv>0&&Math.floor(frame/5)%2===0)ctx.globalAlpha=.35;
 // cloak silhouette and original horned mask
 ctx.fillStyle='#0a0e18';ctx.beginPath();ctx.moveTo(x+5,y+14);ctx.lineTo(x+2,y+36);ctx.lineTo(x-5,y+46);ctx.lineTo(x+15,y+40);ctx.lineTo(x+31,y+46);ctx.lineTo(x+25,y+15);ctx.closePath();ctx.fill();
 ctx.fillStyle='#d9e6ed';ctx.beginPath();ctx.moveTo(x+5,y+13);ctx.lineTo(x+3,y-2);ctx.lineTo(x+13,y+7);ctx.lineTo(x+23,y-3);ctx.lineTo(x+25,y+14);ctx.quadraticCurveTo(x+25,y+28,x+14,y+29);ctx.quadraticCurveTo(x+3,y+27,x+5,y+13);ctx.fill();
 ctx.fillStyle='#152338';ctx.fillRect(x+7,y+13,16,8);ctx.fillStyle='#9ce8ff';ctx.fillRect(x+(player.face>0?17:8),y+16,4,3);
 ctx.fillStyle='#a9c9d9';ctx.fillRect(x+12,y+28,5,13);
 if(player.attack>7){ctx.strokeStyle='#d8f5ff';ctx.lineWidth=4;ctx.beginPath();ctx.arc(x+14+(player.face*24),y+20,23,-.9*player.face,.9*player.face);ctx.stroke()}
 if(player.dash>0){ctx.globalAlpha=.25;ctx.fillStyle='#a4eaff';ctx.fillRect(x-player.face*26,y+5,24,35)}
 ctx.restore()}
function drawEnemy(e){let x=e.x-camera,y=e.y;ctx.fillStyle=e.kind?'#684b70':'#3d7184';ctx.beginPath();ctx.roundRect(x,y+8,e.w,e.h-8,9);ctx.fill();ctx.fillStyle='#bdeaff';ctx.fillRect(x+8,y+16,5,4);ctx.fillRect(x+e.w-13,y+16,5,4);ctx.fillStyle='#18243a';ctx.fillRect(x+7,y+e.h-4,e.w-14,6)}
function update(){
 frame++;
 let dir=(keys.right?1:0)-(keys.left?1:0);
 if(player.inv>0)player.inv--;if(player.attack>0)player.attack--;if(player.dashCd>0)player.dashCd--;
 if(keys.attack)attack();
 if(keys.dash&&player.dashCd===0){player.dash=11;player.dashCd=55;player.vx=player.face*10;player.vy=0;burst(player.x+14,player.y+20,'#8bdfff',5)}
 if(player.dash>0){player.dash--;player.vx=player.face*9}else{if(dir){player.vx+=dir*.7;player.face=dir}else player.vx*=.78;player.vx=Math.max(-4.2,Math.min(4.2,player.vx));player.vy+=gravity}
 if(keys.jump&&player.ground){player.vy=-11.8;player.ground=false;keys.jump=false;burst(player.x+14,player.y+40,'#9abbd1',5)}
 let oldY=player.y;player.x+=player.vx;player.x=Math.max(0,Math.min(worldW-player.w,player.x));player.y+=player.vy;player.ground=false;
 for(const p of platforms){if(player.x+player.w>p.x&&player.x<p.x+p.w&&oldY+player.h<=p.y+8&&player.y+player.h>=p.y&&player.vy>=0){player.y=p.y-player.h;player.vy=0;player.ground=true}}
 if(player.y>H+200){hurt();player.y=player.checkpoint-120}
 for(const e of enemies){if(!e.alive)continue;e.x+=e.v;if(e.x<e.min||e.x+e.w>e.max)e.v*=-1;if(hit(player,e))hurt()}
 for(const s of shards){if(!s.taken&&Math.abs(player.x+14-s.x)<24&&Math.abs(player.y+18-s.y)<35){s.taken=true;player.shards++;player.soul=Math.min(3,player.soul+1);burst(s.x,s.y,'#78e8ff',12);say('حصلت على شظية مضيئة')}}
 if(player.x>2700&&player.checkpoint<2700){player.checkpoint=2780; say('نقطة حفظ جديدة')}
 if(player.x>3460){if(player.shards>=5){say('فتحت البوابة! انتصرت في الفصل الأول');player.x=90;player.y=260;player.shards=0;player.checkpoint=90;enemies.forEach(e=>{e.alive=true;e.hp=e.kind?3:2})}else say('تحتاج إلى 5 شظايا لفتح البوابة')}
 camera=Math.max(0,Math.min(worldW-W,player.x-W*.38));if(shake>0)shake*=.82;
 for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.life--;if(p.life<=0)particles.splice(i,1)}
 document.getElementById('hearts').textContent='♥ '.repeat(player.hp)+'♡ '.repeat(player.maxHp-player.hp);
 document.getElementById('soul').textContent='طاقة: '+'◉ '.repeat(player.soul)+'○ '.repeat(3-player.soul);
 document.getElementById('info').innerHTML='DEPTHS / '+(player.x<1200?'01':player.x<2400?'02':'03')+'<br>شظايا: '+player.shards+' / 5';
}
function draw(){
 ctx.save();if(shake>1)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);drawBg();
 for(const p of platforms)drawPlatform(p);
 // distant arch and final gate
 let gx=3500-camera;ctx.fillStyle='#304b68';ctx.fillRect(gx,330,14,100);ctx.fillRect(gx+75,330,14,100);ctx.fillRect(gx,320,89,13);ctx.fillStyle='#78dfff';ctx.globalAlpha=.65+Math.sin(frame*.06)*.25;ctx.fillRect(gx+23,345,43,70);ctx.globalAlpha=1;
 for(const s of shards){if(s.taken)continue;let x=s.x-camera;ctx.save();ctx.translate(x,s.y+Math.sin(frame*.08+s.x)*5);ctx.rotate(Math.PI/4);ctx.fillStyle='#83eaff';ctx.shadowColor='#72dfff';ctx.shadowBlur=16;ctx.fillRect(-7,-7,14,14);ctx.restore()}
 for(const e of enemies)if(e.alive)drawEnemy(e);drawPlayer();
 for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/35);ctx.fillStyle=p.color;ctx.fillRect(p.x-camera,p.y,4,4)}ctx.globalAlpha=1;
 ctx.restore();
}
function loop(){if(running){update();draw()}requestAnimationFrame(loop)}
document.getElementById('play').onclick=()=>{document.getElementById('start').style.display='none';running=true;say('استكشف الممرات واجمع الشظايا!')};
loop();
})();
</script>
</body>
</html>
